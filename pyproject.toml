[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-subscriber-listener"
version = "0.1.0"
description = "Read-only Playwright listener for authorized X posts and trading-signal candidate extraction."
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.48,<2",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
x-subscriber-listener = "x_listener.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["x_listener*"]
